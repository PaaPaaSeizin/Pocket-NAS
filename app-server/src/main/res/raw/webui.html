<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>PocketNAS Web</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#f5f6fa;--surface:#fff;--text:#1a1c1e;--sub:#5f6368;--primary:#2e7d32;--border:#e0e0e0;--chip:#e8f5e9}
        [data-theme=dark]{--bg:#121212;--surface:#1e1e1e;--text:#e8eaed;--sub:#9aa0a6;--primary:#81c784;--border:#333;--chip:#1b3a1c}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 4px rgba(0,0,0,.1)}
        header h1{font-size:18px;font-weight:600;flex:1}
        header .status{font-size:12px;opacity:.9;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px}
        .toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .toolbar button,.toolbar select{background:var(--chip);border:none;color:var(--text);padding:6px 12px;border-radius:16px;cursor:pointer;font-size:13px}
        .toolbar button.active{background:var(--primary);color:#fff}
        .searchbar{display:flex;gap:6px;flex:1;min-width:200px}
        .searchbar input{flex:1;padding:6px 12px;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);font-size:13px}
        .searchbar button{padding:6px 10px;border-radius:16px;font-size:12px}
        .breadcrumb{padding:8px 12px;font-size:13px;color:var(--sub);overflow-x:auto;white-space:nowrap;background:var(--surface);border-bottom:1px solid var(--border)}
        .breadcrumb a{color:var(--primary);cursor:pointer;text-decoration:none}
        .breadcrumb span{margin:0 4px;color:var(--sub)}
        main{padding:12px;max-width:1400px;margin:0 auto;padding-bottom:100px}
        .list{background:var(--surface);border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
        .item{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;gap:10px}
        .item:last-child{border-bottom:none}
        .item:hover{background:rgba(0,0,0,.03)}
        .item.selected{background:var(--chip)}
        .item .check{width:18px;height:18px;border:2px solid var(--sub);border-radius:4px;flex-shrink:0;display:none;align-items:center;justify-content:center;font-size:12px;color:#fff}
        .item.selmode .check{display:flex}
        .item.selected .check{background:var(--primary);border-color:var(--primary)}
        .item .icon{font-size:26px;width:38px;height:38px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:4px}
        .item .icon img{width:100%;height:100%;object-fit:cover;display:block}
        .item .info{flex:1;min-width:0}
        .item .name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .item .meta{font-size:11px;color:var(--sub);margin-top:2px}
        .item .fav{font-size:14px;color:#e91e63}
        .item .more{padding:4px 8px;color:var(--sub);cursor:pointer;font-size:18px;user-select:none}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;background:transparent}
        .grid .item{flex-direction:column;background:var(--surface);border-radius:8px;padding:12px;border:none;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
        .grid .item .icon{font-size:36px;width:100%;height:80px;margin-bottom:4px}
        .grid .item .name{font-size:12px;max-width:100%}
        .grid .item .meta{display:none}
        .grid .item .more{position:absolute;top:4px;right:4px;font-size:14px}
        .grid .item{position:relative}
        .empty{padding:40px 20px;text-align:center;color:var(--sub)}
        .fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:40;display:flex;align-items:center;justify-content:center}
        .fab:active{transform:scale(.95)}
        .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
        .modal{background:var(--surface);border-radius:12px;max-width:min(720px,95vw);max-height:90vh;width:100%;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.3)}
        .modal header{background:var(--surface);color:var(--text);border-bottom:1px solid var(--border);box-shadow:none;position:static}
        .modal .body{padding:16px;overflow:auto;flex:1}
        .modal .body img,.modal .body video{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:4px}
        .modal .body pre{font-family:monospace;font-size:12px;background:var(--bg);padding:12px;border-radius:4px;overflow:auto;max-height:60vh;white-space:pre-wrap;word-break:break-all}
        .modal .body .row{display:flex;padding:8px 0;border-bottom:1px solid var(--border)}
        .modal .body .row .lbl{color:var(--sub);width:40%}
        .modal .body .row .val{flex:1;text-align:right;font-weight:600}
        .modal footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
        .modal footer button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px}
        .btn{background:var(--primary);color:#fff}
        .btn-outline{background:transparent;color:var(--primary);border:1px solid var(--primary)!important}
        .btn-danger{background:#c62828;color:#fff}
        .btn-neutral{background:var(--chip);color:var(--text)}
        .progress{width:100%;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
        .progress .fill{height:100%;background:var(--primary);width:0;transition:width .15s}
        .ctx-menu{position:fixed;background:var(--surface);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:200;min-width:200px;padding:6px 0;font-size:14px}
        .ctx-menu .mi{padding:10px 16px;cursor:pointer;display:flex;gap:10px}
        .ctx-menu .mi:hover{background:var(--chip)}
        .ctx-menu .mi.danger{color:#c62828}
        .ctx-menu .sep{height:1px;background:var(--border);margin:4px 0}
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.95);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
        .toast.show{opacity:1}
        .topbar-sel{display:none;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px;gap:8px;align-items:center;position:sticky;top:0;z-index:45;flex-wrap:wrap}
        .topbar-sel.show{display:flex}
        .topbar-sel b{flex:1}
        .topbar-sel button{padding:6px 12px;border:none;border-radius:16px;cursor:pointer;font-size:13px;background:var(--chip);color:var(--text)}
        .topbar-sel button.danger{background:#ffcdd2;color:#c62828}
        input[type=file]{display:none}
    
        /* ★Step5: 長い名前のはみ出し対策 */
        .modal header h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .item .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .grid .item .info{width:100%;min-width:0}
        .grid .item .name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
        .modal .body .row .val{min-width:0;word-break:break-all}
        .toast{max-width:90vw;word-break:break-all;text-align:center}
        .modal .body img.pdfpage{max-height:none;max-width:none}
</style>
</head>
<body>
<header>
    <h1>PocketNAS</h1>
    <div class="status" id="status">接続中...</div>
    <button id="btnTheme" title="テーマ切替">🌓</button>
    <button id="btnStatus" title="サーバー状態">⚙</button>
</header>

<div class="toolbar">
    <div class="searchbar">
        <input type="text" id="searchInput" placeholder="ファイル名で検索">
        <button id="btnServerSearch">全体検索</button>
    </div>
    <button id="btnSort">名前 ↑</button>
    <button id="btnView">🔲 グリッド</button>
    <button id="btnHidden">👁 隠し表示</button>
    <button id="btnTrash">🗑 ゴミ箱</button>
</div>

<div class="breadcrumb" id="breadcrumb"></div>

<div class="topbar-sel" id="selBar">
    <b id="selCount">0件選択</b>
    <button id="btnSelAll">全選択</button>
    <button id="btnSelDelete" class="danger">削除</button>
    <button id="btnSelCancel">解除</button>
</div>

<main>
    <div id="content" class="list"></div>
    <div class="empty" id="empty" style="display:none"></div>
</main>

<button class="fab" id="fab">＋</button>
<input type="file" id="fileInput" multiple>

<div class="toast" id="toast"></div>
<script>
    /* ===================== 状態 ===================== */
    const S = {
      host:'', path:'', files:[],
      sort:localStorage.getItem('pn_sort')||'NAME_ASC',
      view:localStorage.getItem('pn_view')||'list',
      hidden:localStorage.getItem('pn_hidden')==='1',
      theme:localStorage.getItem('pn_theme')||'light',
      favs:JSON.parse(localStorage.getItem('pn_favs')||'[]'),
      selMode:false, sel:new Set(), searchMode:false,
      lockedFolders:[], passwordSet:false,
      previewBg:null, booted:false
    };

    /* ===================== ユーティリティ ===================== */
    const $ = (s,p=document)=>p.querySelector(s);
    const $$ = (s,p=document)=>Array.from(p.querySelectorAll(s));
    const enc = s=>encodeURIComponent(s||'');
    const fmt = b=>{
      if(b<0) return '-';
      if(b>=1<<30) return (b/(1<<30)).toFixed(2)+' GB';
      if(b>=1<<20) return (b/(1<<20)).toFixed(1)+' MB';
      if(b>=1<<10) return (b/(1<<10)).toFixed(1)+' KB';
      return b+' B';
    };
    const esc = s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const toast = (msg,ms=2000)=>{
      const t=$('#toast'); t.textContent=msg; t.classList.add('show');
      clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),ms);
    };
    // ★Step6: 認証エラー（401/フォルダロック403）を共通処理する
    const api = async (method,path,opts={})=>{
      const res = await fetch(S.host+path,{method,...opts});
      if(path.startsWith('/api/auth/')) return res;
      if(res.status===401){
        showLogin();
        throw new Error('認証が必要です');
      }
      if(res.status===403 && !opts._retried){
        const text = await res.clone().text().catch(()=> '');
        if(text.startsWith('FOLDER_LOCKED:')){
          const folder = text.substring('FOLDER_LOCKED:'.length);
          const ok = await askFolderUnlock(folder);
          if(ok) return api(method,path,{...opts,_retried:true});
          throw new Error('フォルダがロックされています');
        }
      }
      return res;
    };

    /* ★Step6: ログイン画面 */
    let loginShown = false;
    function showLogin(){
      if(loginShown) return;
      loginShown = true;
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.style.zIndex = 400;
      bg.innerHTML = '<div class="modal" style="max-width:360px">' +
        '<header><h1>🔐 ログイン</h1></header>' +
        '<div class="body">' +
        '<p style="font-size:13px;color:var(--sub);margin-bottom:10px">サーバーパスワードを入力してください</p>' +
        '<input id="loginPw" type="password" placeholder="パスワード" ' +
        'style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)">' +
        '</div>' +
        '<footer><button class="btn" id="loginBtn">ログイン</button></footer></div>';
      document.body.appendChild(bg);
      const doLogin = async ()=>{
        const pw = bg.querySelector('#loginPw').value;
        const res = await fetch(S.host + '/api/auth/login', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({password:pw})
        });
        if(res.ok){
          bg.remove();
          loginShown = false;
          refreshAuthStatus();
          loadFiles(S.path || '');
        } else {
          toast('パスワードが違います');
        }
      };
      bg.querySelector('#loginBtn').onclick = doLogin;
      bg.querySelector('#loginPw').addEventListener('keydown', e=>{
        if(e.key==='Enter') doLogin();
      });
      setTimeout(()=>{ const el = bg.querySelector('#loginPw'); if(el) el.focus(); }, 50);
    }

    /* ★Step6: フォルダロック解除ダイアログ */
    function askFolderUnlock(folder){
      return new Promise(resolve=>{
        const modal = openModal('🔐 ロックされています',
          '<p style="font-size:13px;color:var(--sub);margin-bottom:10px">「' + esc(folder) +
          '」を開くにはパスワードが必要です</p>' +
          '<input id="folderPw" type="password" placeholder="パスワード" ' +
          'style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)">');
        const bg = modal.parentElement;
        const footer = modal.querySelector('footer');
        const okBtn = document.createElement('button');
        okBtn.className = 'btn';
        okBtn.textContent = '解除';
        footer.insertBefore(okBtn, footer.firstChild);
        okBtn.onclick = async ()=>{
          const pw = modal.querySelector('#folderPw').value;
          const res = await fetch(S.host + '/api/auth/folder/unlock', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({path:folder, password:pw})
          });
          if(res.ok){
            bg.remove();
            refreshAuthStatus();
            resolve(true);
          } else {
            toast('パスワードが違います');
          }
        };
        const obs = new MutationObserver(()=>{
          if(!document.body.contains(bg)){ obs.disconnect(); resolve(false); }
        });
        obs.observe(document.body, {childList:true});
        setTimeout(()=>{ const el = modal.querySelector('#folderPw'); if(el) el.focus(); }, 50);
      });
    }

    /* ★Step6: 認証状態の取得（ロック中フォルダ・ログアウトボタン） */
    async function refreshAuthStatus(){
      try{
        const res = await fetch(S.host + '/api/auth/status');
        if(!res.ok) return;
        const j = await res.json();
        S.lockedFolders = j.lockedFolders || [];
        S.passwordSet = !!j.serverPasswordSet;
        let btn = document.querySelector('#btnLogout');
        if(S.passwordSet && !btn){
          btn = document.createElement('button');
          btn.id = 'btnLogout';
          btn.textContent = '🔓 ログアウト';
          btn.onclick = async ()=>{
            await fetch(S.host + '/api/auth/logout', {method:'POST'});
            location.reload();
          };
          document.querySelector('header').appendChild(btn);
        }
        if(!S.passwordSet && btn) btn.remove();
        render();
      }catch(e){}
    }

    const isImage = name => {
      const ext=(name.split('.').pop()||'').toLowerCase();
      return ['jpg','jpeg','png','gif','webp','bmp','heic'].includes(ext);
    };
    const fileIcon = (name,dir)=>{
      if(dir) return '📁';
      const ext=(name.split('.').pop()||'').toLowerCase();
      if(['jpg','jpeg','png','gif','webp','bmp','heic'].includes(ext)) return '🖼️';
      if(['mp4','mkv','webm','mov','m4v','3gp'].includes(ext)) return '🎬';
      if(['mp3','wav','flac','ogg','m4a','aac'].includes(ext)) return '🎵';
      if(['zip','rar','7z','tar','gz'].includes(ext)) return '🗜️';
      if(['pdf'].includes(ext)) return '📕';
      if(['txt','md','log'].includes(ext)) return '📄';
      if(['json','xml','yml','yaml','toml'].includes(ext)) return '⚙️';
      if(['kt','java','py','js','ts','go','rs','c','cpp','h','sh','html','css'].includes(ext)) return '💻';
      if(['apk'].includes(ext)) return '📦';
      return '📎';
    };

    const isVideo = name => {
      const ext=(name.split('.').pop()||'').toLowerCase();
      return ['mp4','mkv','webm','mov','m4v','3gp','avi'].includes(ext);
    };
    // ★Step7: PDF もサムネイル対象に（サーバーが1ページ目を画像化する）
    const isPdf = name => (name.split('.').pop()||'').toLowerCase()==='pdf';
    // ★P1: 画像はサムネイルimgを返す
    // ★Step2: 動画もサムネイル対象に。取得失敗時は絵文字アイコンへ差し替える
    function iconHtml(f) {
      if (isImage(f.name) || isVideo(f.name) || isPdf(f.name)) {
        const url = S.host + '/api/thumbnail?size=200&path=' + enc(f.path);
        const fallback = isVideo(f.name) ? '🎬' : (isPdf(f.name) ? '📕' : '🖼️');
        return `<img src="${url}" loading="lazy" alt="" onerror="this.parentNode.textContent='${fallback}'">`;
      }
      return fileIcon(f.name, f.directory);
    }

    /* ===================== テーマ ===================== */
    function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme);}
    $('#btnTheme').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('pn_theme',S.theme);applyTheme();};

    /* ===================== ソート ===================== */
    const sorts=[
      ['NAME_ASC','名前 ↑'],['NAME_DESC','名前 ↓'],
      ['DATE_DESC','新しい順'],['DATE_ASC','古い順'],
      ['SIZE_DESC','サイズ大'],['SIZE_ASC','サイズ小'],
      ['TYPE','種類']
    ];
    function sortFiles(arr){
      const a=[...arr];
      a.sort((x,y)=>{
        if(x.directory!==y.directory) return x.directory?-1:1;
        const xn=(x.name||'').toLowerCase(), yn=(y.name||'').toLowerCase();
        switch(S.sort){
          case 'NAME_ASC':return xn<yn?-1:xn>yn?1:0;
          case 'NAME_DESC':return xn>yn?-1:xn<yn?1:0;
          case 'DATE_DESC':return (y.modified||0)-(x.modified||0);
          case 'DATE_ASC':return (x.modified||0)-(y.modified||0);
          case 'SIZE_DESC':return (y.size||0)-(x.size||0);
          case 'SIZE_ASC':return (x.size||0)-(y.size||0);
          case 'TYPE':{
            const xe=(x.name.split('.').pop()||'').toLowerCase();
            const ye=(y.name.split('.').pop()||'').toLowerCase();
            return xe<ye?-1:xe>ye?1:xn<yn?-1:1;
          }
        }
        return 0;
      });
      return a;
    }
    $('#btnSort').onclick=()=>{
      const i=sorts.findIndex(s=>s[0]===S.sort);
      S.sort=sorts[(i+1)%sorts.length][0];
      localStorage.setItem('pn_sort',S.sort);
      $('#btnSort').textContent='↕ '+sorts.find(s=>s[0]===S.sort)[1];
      render();
    };

    /* ===================== ビュー切替 ===================== */
    function applyView(){
      $('#btnView').textContent=S.view==='grid'?'📋 リスト':'🔲 グリッド';
      $('#content').className=S.view==='grid'?'grid':'list';
    }
    $('#btnView').onclick=()=>{S.view=S.view==='grid'?'list':'grid';localStorage.setItem('pn_view',S.view);applyView();render();};

    /* ===================== 隠しファイル ===================== */
    $('#btnHidden').onclick=()=>{S.hidden=!S.hidden;localStorage.setItem('pn_hidden',S.hidden?'1':'0');$('#btnHidden').classList.toggle('active',S.hidden);render();};

    /* ===================== ハッシュルーティング ===================== */
    /* ★Step7: 現在のフォルダとプレビュー中ファイルを URL ハッシュに反映する
       - フォルダ: #/dir/sub
       - プレビュー中: #/dir/sub?file=name.ext
       これでブラウザの「戻る」でプレビューを閉じたり前のフォルダに戻れるようになり、
       リロードしてもルートに戻らず同じ場所を復元できる */
    let routeFile = null;   // プレビュー中ファイルのフルパス（なければ null）
    function parseRoute(){
      let h = (location.hash || '').replace(/^#\/?/, '');
      let file = null;
      const qi = h.indexOf('?file=');
      if(qi >= 0){
        try{ file = decodeURIComponent(h.substring(qi + 6)); }catch(e){ file = null; }
        h = h.substring(0, qi);
      }
      const path = h.split('/').filter(s=>s.length>0)
        .map(s=>{ try{ return decodeURIComponent(s); }catch(e){ return s; } }).join('/');
      return { path, file };
    }
    function routeString(){
      const segs = S.path ? S.path.split('/').map(encodeURIComponent).join('/') : '';
      let h = '#/' + segs;
      if(routeFile){
        h += '?file=' + enc(routeFile.substring(routeFile.lastIndexOf('/') + 1));
      }
      return h;
    }
    function writeRoute(push){
      const h = routeString();
      if(location.hash === h) return;
      if(push) location.hash = h;          // 履歴に積む（戻るが効く）
      else history.replaceState(null, '', h); // 履歴を増やさず差し替え
    }
    // プレビュー用モーダルが閉じられたら URL からファイル指定を取り除く
    function trackPreviewModal(modal){
      const bg = modal.parentElement;
      S.previewBg = bg;
      const obs = new MutationObserver(()=>{
        if(!document.body.contains(bg)){
          obs.disconnect();
          if(S.previewBg === bg) S.previewBg = null;
          if(routeFile){ routeFile = null; writeRoute(false); }
        }
      });
      obs.observe(document.body, {childList:true});
    }
    function markRouteFile(item, push){
      if(S.searchMode) return;   // 全体検索結果からのプレビューは URL に載せない
      routeFile = item.path;
      writeRoute(push);
    }
    function hookPreviewRoute(modal, item, opts){
      trackPreviewModal(modal);
      if(opts && opts.fromRoute) routeFile = item.path;
      else markRouteFile(item, true);
    }
    async function applyRoute(){
      const r = parseRoute();
      if(r.path !== S.path || !S.booted){
        await loadFiles(r.path, {fromRoute:true});
      }
      S.booted = true;
      if(r.file){
        const full = r.path ? r.path + '/' + r.file : r.file;
        if(routeFile !== full){
          const item = S.files.find(f=>f.path === full);
          if(item) previewFile(item, {fromRoute:true});
        }
      } else if(S.previewBg && document.body.contains(S.previewBg)){
        S.previewBg.remove();   // 「戻る」でプレビューを閉じる
      }
      writeRoute(false);   // URL を現在の状態に合わせて正規化する
    }
    window.addEventListener('hashchange', ()=>{ applyRoute(); });

    /* ===================== ファイル一覧 ===================== */
    async function loadFiles(path, opts={}){
      S.path=path; S.searchMode=false;
      $('#status').textContent='読み込み中...';
      try{
        const res = await api('GET','/api/files?path='+enc(path));
        if(!res.ok) throw new Error('HTTP '+res.status);
        S.files = await res.json();
        $('#status').textContent='接続中 ('+S.files.length+'件)';
        updateBreadcrumb(); render();
        if(!opts.fromRoute) writeRoute(true);
      }catch(e){
        $('#status').textContent='切断';
        $('#content').innerHTML='<div class="empty">読み込み失敗: '+esc(e.message)+'</div>';
      }
    }

    function updateBreadcrumb(){
      const bc=$('#breadcrumb');
      let html='<a data-path="">🏠 ルート</a>';
      if(S.path){
        let acc='';
        S.path.split('/').forEach(p=>{
          acc=acc?acc+'/'+p:p;
          html+='<span>›</span><a data-path="'+esc(acc)+'">'+esc(p)+'</a>';
        });
      }
      bc.innerHTML=html;
      $$('#breadcrumb a').forEach(a=>a.onclick=()=>loadFiles(a.dataset.path));
    }

    function itemHtml(f){
      const sel = S.sel.has(f.path);
      const isFav = S.favs.includes(f.path);
      const date = f.modified > 0 ? new Date(f.modified) /* ★修正: ミリ秒で返るので *1000 しない */.toLocaleString() : '';
      const size = f.directory ? 'フォルダ' : fmt(f.size);
      return `<div class="item${sel?' selected':''}${S.selMode?' selmode':''}" data-path="${esc(f.path)}" data-name="${esc(f.name)}" data-dir="${f.directory}">
        <div class="check">✓</div>
        <div class="icon">${iconHtml(f)}</div>
        <div class="info">
          <div class="name" title="${esc(f.name)}">${esc(f.name)}${(f.directory && S.lockedFolders.includes(f.path)) ? ' 🔒' : ''}</div>
          <div class="meta">${esc(size)}${date?' · '+esc(date):''}</div>
        </div>
        ${isFav?'<div class="fav">★</div>':''}
        <div class="more">⋮</div>
      </div>`;
    }

    function bindItems(sorted){
      // ★Step5: find() の繰り返し（O(n^2)）をやめ、Map で引く
      const byPath = new Map(sorted.map(f=>[f.path, f]));
      $$('#content .item').forEach(el=>{
        const path = el.dataset.path;
        const real = byPath.get(path);
        el.onclick=(e)=>{
          if(e.target.classList.contains('more')){e.stopPropagation();showMenu(real,el);return;}
          if(S.selMode){toggleSel(path,el);return;}
          if(real.directory) loadFiles(path);
          else previewFile(real);
        };
        el.oncontextmenu=(e)=>{e.preventDefault();showMenu(real,el);};
        el.querySelector('.more').onclick=(e)=>{e.stopPropagation();showMenu(real,el);};
      });
    }

    function render(){
      const filtered = S.files.filter(f=>{
        if(!S.hidden && f.name.startsWith('.')) return false;
        return true;
      });
      const sorted = sortFiles(filtered);
      const content = $('#content');
      const empty = $('#empty');
      if(sorted.length===0){
        content.innerHTML='';
        empty.textContent = S.searchMode ? '一致する項目なし' : 'このフォルダは空です';
        empty.style.display='block'; return;
      }
      empty.style.display='none';
      content.innerHTML = sorted.map(itemHtml).join('');
      bindItems(sorted);
    }

    /* ===================== 選択 ===================== */
    function toggleSel(path,el){
      if(S.sel.has(path)){S.sel.delete(path);el.classList.remove('selected');}
      else {S.sel.add(path);el.classList.add('selected');}
      updateSelBar();
      if(S.sel.size===0) exitSelMode();
    }
    function enterSelMode(){S.selMode=true;$('#selBar').classList.add('show');$$('.item').forEach(e=>e.classList.add('selmode'));}
    function exitSelMode(){S.selMode=false;S.sel.clear();$('#selBar').classList.remove('show');render();}
    function updateSelBar(){$('#selCount').textContent=S.sel.size+'件選択';}
    $('#btnSelCancel').onclick=exitSelMode;
    $('#btnSelAll').onclick=()=>{S.files.forEach(f=>S.sel.add(f.path));render();updateSelBar();};

    /* ===================== コンテキストメニュー ===================== */
    function showMenu(item, anchorEl){
      closeCtxMenu();
      const isFav = S.favs.includes(item.path);
      const menu = document.createElement('div');
      menu.className='ctx-menu';
      const items = [
        item.directory ? null : ['👁 プレビュー','preview'],
        item.directory ? null : ['💾 ダウンロード','download'],
        ['☆ お気に入り' + (isFav?'解除':'登録'),'fav'],
        ['✏️ 名前変更','rename'],
        ['➡️ 移動','move'],
        ['📋 コピー','copy'],
        ['ℹ️ 詳細','detail'],
        'sep',
        ['🗑 削除','delete','danger'],
        ['☑ 複数選択開始','selmode']
      ].filter(Boolean);
      menu.innerHTML = items.map(it => it==='sep'
        ? '<div class="sep"></div>'
        : `<div class="mi${it[2]==='danger'?' danger':''}" data-act="${it[1]}">${it[0]}</div>`
      ).join('');
      document.body.appendChild(menu);
      const rect = anchorEl.getBoundingClientRect();
      menu.style.top = Math.min(rect.bottom+4, window.innerHeight-menu.offsetHeight-8)+'px';
      menu.style.left = Math.min(rect.left, window.innerWidth-menu.offsetWidth-8)+'px';
      $$('.mi', menu).forEach(mi=>{
        mi.onclick=()=>{closeCtxMenu();handleAction(mi.dataset.act, item);};
      });
      setTimeout(()=>document.addEventListener('click', closeCtxMenu, {once:true}), 10);
    }
    function closeCtxMenu(){$('.ctx-menu')?.remove();}

    async function handleAction(act, item){
      switch(act){
        case 'preview': previewFile(item); break;
        case 'download': {
          const a = document.createElement('a');
          a.href = S.host + '/api/download?path=' + enc(item.path);
          a.download = item.name;
          a.click();
          break;
        }
        case 'fav': {
          const i = S.favs.indexOf(item.path);
          if(i>=0) S.favs.splice(i,1); else S.favs.unshift(item.path);
          localStorage.setItem('pn_favs', JSON.stringify(S.favs));
          render(); break;
        }
        case 'rename': {
          const name = prompt('新しい名前', item.name);
          if(!name || name === item.name) return;
          const r = await api('POST', '/api/rename?path='+enc(item.path)+'&name='+enc(name));
          toast(r.ok?'変更しました':'失敗: '+r.status); loadFiles(S.path); break;
        }
        case 'move': pickFolder('移動先', async(dst)=>{
          const newPath = dst ? dst+'/'+item.name : item.name;
          const r = await api('POST', '/api/move?from='+enc(item.path)+'&to='+enc(newPath));
          toast(r.ok?'移動しました':'失敗: '+r.status); loadFiles(S.path);
        }); break;
        case 'copy': pickFolder('コピー先', async(dst)=>{
          const newPath = dst ? dst+'/'+item.name : 'copy_'+item.name;
          const r = await api('POST', '/api/copy?from='+enc(item.path)+'&to='+enc(newPath));
          toast(r.ok?'コピーしました':'失敗: '+r.status); loadFiles(S.path);
        }); break;
        case 'detail': showDetail(item); break;
        case 'delete': {
          if(!confirm('「'+item.name+'」を削除しますか？')) return;
          const r = await api('DELETE', '/api/files?path='+enc(item.path)+'&trash=true');
          toast(r.ok?'削除しました':'失敗: '+r.status); loadFiles(S.path); break;
        }
        case 'selmode': enterSelMode(); S.sel.add(item.path); render(); updateSelBar(); break;
      }
    }

    /* ===================== プレビュー ===================== */
    async function previewFile(item, opts={}){
      const ext = (item.name.split('.').pop()||'').toLowerCase();
      const url = S.host + '/api/download?path=' + enc(item.path);
      if(['jpg','jpeg','png','gif','webp','bmp','heic'].includes(ext)){
        openImageViewer(item, opts);
      } else if(['mp4','mkv','webm','mov','m4v','3gp'].includes(ext)){
        const modal = openModal(item.name, `<video src="${url}" controls autoplay></video>`);
        hookPreviewRoute(modal, item, opts);
      } else if(ext==='pdf'){
        openPdfViewer(item, opts);
      } else if(['mp3','wav','flac','ogg','m4a','aac'].includes(ext)){
        openAudioPlayer(item, opts);
      } else if(['txt','md','log','json','csv','xml','kt','java','py','js','ts','html','css','sh','yaml','yml','toml'].includes(ext)){
        const modal = openModal(item.name, '<div>読み込み中...</div>');
        hookPreviewRoute(modal, item, opts);
        try {
          const res = await fetch(url);
          const text = await res.text();
          modal.querySelector('.body').innerHTML = '<pre>'+esc(text.substring(0,200000))+'</pre>';
        } catch(e) {
          modal.querySelector('.body').innerHTML = '<div>取得失敗: '+esc(e.message)+'</div>';
        }
      } else {
        if(confirm('この形式はプレビュー非対応です。ダウンロードしますか？')) handleAction('download', item);
      }
    }

    /* ★Step5: PDFビューア（サーバーでページを画像化し、全ページをスクロール表示） */
    async function openPdfViewer(item, opts={}){
      const modal = openModal(item.name, '<div style="text-align:center;color:var(--sub)">読み込み中…</div>');
      hookPreviewRoute(modal, item, opts);
      const body = modal.querySelector('.body');
      const footer = modal.querySelector('footer');
      try{
        const info = await (await api('GET', '/api/pdf/info?path=' + enc(item.path))).json();
        const pages = info.pages || 0;
        if(pages<=0){ body.innerHTML = '<div>ページ数を取得できませんでした</div>'; return; }
        let width = 1200;
        body.innerHTML = '<div data-pdfwrap style="overflow:auto;max-height:72vh;text-align:center"></div>';
        const wrap = body.querySelector('[data-pdfwrap]');
        function renderPages(){
          let html = '';
          const dispPct = Math.round(width / 12);
          for(let i=0;i<pages;i++){
            html += '<img class="pdfpage" loading="lazy" alt="' + (i+1) + 'ページ" ' +
              'src="' + S.host + '/api/pdf/page?width=' + width + '&page=' + i + '&path=' + enc(item.path) + '" ' +
              'style="width:' + dispPct + '%;display:block;margin:0 auto 10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)">';
            html += '<div style="font-size:11px;color:var(--sub);margin-bottom:10px">' + (i+1) + ' / ' + pages + '</div>';
          }
          wrap.innerHTML = html;
        }
        renderPages();
        const ctrls = document.createElement('div');
        ctrls.style.cssText = 'display:flex;gap:8px;align-items:center;margin-right:auto';
        ctrls.innerHTML = '<button class="btn-neutral" data-zout>－ 縮小</button>' +
          '<button class="btn-neutral" data-zin>＋ 拡大</button>';
        footer.insertBefore(ctrls, footer.firstChild);
        ctrls.querySelector('[data-zin]').onclick=()=>{ width = Math.min(2000, width+400); renderPages(); };
        ctrls.querySelector('[data-zout]').onclick=()=>{ width = Math.max(400, width-400); renderPages(); };
      }catch(e){
        body.innerHTML = '<div>読み込み失敗: ' + esc(e.message) + '</div>';
      }
    }

    const isAudio = name => {
      const ext=(name.split('.').pop()||'').toLowerCase();
      return ['mp3','wav','flac','ogg','m4a','aac'].includes(ext);
    };

    /* ★Step4: 音楽プレイヤー（前後切替・終わったら次へ） */
    function openAudioPlayer(item, opts={}){
      const tracks = S.files.filter(f=>!f.directory && isAudio(f.name));
      let idx = tracks.findIndex(f=>f.path===item.path);
      if(idx<0) idx = 0;
      if(tracks.length===0) return;
      const modal = openModal(tracks[idx].name,
        '<div style="text-align:center;font-size:56px;padding:10px">🎵</div>' +
        '<audio id="audioEl" controls autoplay style="width:100%"></audio>');
      hookPreviewRoute(modal, item, opts);
      const audio = modal.querySelector('#audioEl');
      const titleEl = modal.querySelector('header h1');
      const footer = modal.querySelector('footer');
      const nav = document.createElement('div');
      nav.style.cssText = 'display:flex;gap:8px;align-items:center;margin-right:auto';
      nav.innerHTML = '<button class="btn-neutral" data-prev>‹ 前</button>' +
        '<span data-count style="font-size:13px;color:var(--sub)"></span>' +
        '<button class="btn-neutral" data-next>次 ›</button>';
      footer.insertBefore(nav, footer.firstChild);
      const countEl = nav.querySelector('[data-count]');
      function show(i, autoplay){
        idx = (i + tracks.length) % tracks.length;
        const f = tracks[idx];
        audio.src = S.host + '/api/download?path=' + enc(f.path);
        titleEl.textContent = f.name;
        countEl.textContent = (idx+1) + ' / ' + tracks.length;
        // ★Step7: 曲を切り替えたら URL のファイル指定も差し替える（履歴は増やさない）
        if(!S.searchMode){ routeFile = f.path; writeRoute(false); }
        if(autoplay) audio.play().catch(()=>{});
      }
      nav.querySelector('[data-prev]').onclick=()=>show(idx-1, true);
      nav.querySelector('[data-next]').onclick=()=>show(idx+1, true);
      audio.onended=()=>{ if(idx < tracks.length-1) show(idx+1, true); };
      show(idx, true);
    }

    /* ★Step3: 画像ビューア（前後切替・キーボード対応） */
    function openImageViewer(item, opts={}){
      const imgs = S.files.filter(f=>!f.directory && isImage(f.name));
      let idx = imgs.findIndex(f=>f.path===item.path);
      if(idx<0) idx = 0;
      if(imgs.length===0) return;
      const modal = openModal(imgs[idx].name, '<img id="viewerImg" alt="">');
      hookPreviewRoute(modal, item, opts);
      const bg = modal.parentElement;
      const img = modal.querySelector('#viewerImg');
      const titleEl = modal.querySelector('header h1');
      const footer = modal.querySelector('footer');
      const nav = document.createElement('div');
      nav.style.cssText = 'display:flex;gap:8px;align-items:center;margin-right:auto';
      nav.innerHTML = '<button class="btn-neutral" data-prev>‹ 前</button>' +
        '<span data-count style="font-size:13px;color:var(--sub)"></span>' +
        '<button class="btn-neutral" data-next>次 ›</button>';
      footer.insertBefore(nav, footer.firstChild);
      const countEl = nav.querySelector('[data-count]');
      function show(i){
        idx = (i + imgs.length) % imgs.length;
        const f = imgs[idx];
        img.src = S.host + '/api/download?path=' + enc(f.path);
        img.alt = f.name;
        titleEl.textContent = f.name;
        countEl.textContent = (idx+1) + ' / ' + imgs.length;
        // ★Step7: 画像を切り替えたら URL のファイル指定も差し替える（履歴は増やさない）
        if(!S.searchMode){ routeFile = f.path; writeRoute(false); }
        // 前後を先読みして切替を速くする
        [idx-1, idx+1].forEach(j=>{
          if(j>=0 && j<imgs.length){
            const pre = new Image();
            pre.src = S.host + '/api/download?path=' + enc(imgs[j].path);
          }
        });
      }
      nav.querySelector('[data-prev]').onclick=()=>show(idx-1);
      nav.querySelector('[data-next]').onclick=()=>show(idx+1);
      const onKey = (e)=>{
        if(!document.body.contains(bg)){ document.removeEventListener('keydown', onKey); return; }
        if(e.key==='ArrowLeft') show(idx-1);
        if(e.key==='ArrowRight') show(idx+1);
        if(e.key==='Escape'){ bg.remove(); document.removeEventListener('keydown', onKey); }
      };
      document.addEventListener('keydown', onKey);
      show(idx);
    }

    function openModal(title, bodyHtml){
      const bg = document.createElement('div');
      bg.className='modal-bg';
      bg.innerHTML = `<div class="modal">
        <header><h1>${esc(title)}</h1><button data-close>✕</button></header>
        <div class="body">${bodyHtml}</div>
        <footer><button data-close class="btn-neutral">閉じる</button></footer>
      </div>`;
      bg.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>bg.remove());
      bg.onclick=(e)=>{if(e.target===bg)bg.remove();};
      document.body.appendChild(bg);
      return bg.querySelector('.modal');
    }

    /* ===================== 詳細 ===================== */
    function showDetail(item){
      const rows=[
        ['種類', item.directory?'フォルダ':(item.name.split('.').pop()||'').toUpperCase()],
        ['サイズ', item.directory?'-':fmt(item.size)],
        ['更新日時', item.modified>0?new Date(item.modified).toLocaleString():'-'],
        ['パス', '/'+item.path]
      ];
      const html = rows.map(r=>`<div class="row"><div class="lbl">${r[0]}</div><div class="val">${esc(r[1])}</div></div>`).join('');
      openModal(item.name, html);
    }

    /* ===================== フォルダピッカー ===================== */
    async function pickFolder(title, cb){
      let cur = S.path;
      const modal = openModal(title, '<div id="pickList" style="min-height:200px"></div>');
      const body = modal.querySelector('.body');
      const footer = modal.querySelector('footer');
      footer.innerHTML = `<button class="btn-outline" data-pick>このフォルダに決定</button>
        <button class="btn-neutral" data-cancel>キャンセル</button>`;
      footer.querySelector('[data-cancel]').onclick=()=>modal.parentElement.remove();
      footer.querySelector('[data-pick]').onclick=()=>{modal.parentElement.remove();cb(cur);};

      async function reload(){
        const bc = cur?'/'+cur:'/';
        body.innerHTML = `<div style="padding:8px;font-size:12px;color:var(--sub)">現在: ${esc(bc)}</div>
          <div id="pickItems"></div>`;
        const items = body.querySelector('#pickItems');
        if(cur){
          const up = document.createElement('div');
          up.className='item';
          up.innerHTML='<div class="icon">⬆</div><div class="info"><div class="name">上のフォルダ</div></div>';
          up.onclick=()=>{cur=cur.substring(0,cur.lastIndexOf('/'))||'';reload();};
          items.appendChild(up);
        }
        try{
          const res = await api('GET','/api/files?path='+enc(cur));
          const files = await res.json();
          files.filter(f=>f.directory).forEach(f=>{
            const el = document.createElement('div');
            el.className='item';
            el.innerHTML = `<div class="icon">📁</div><div class="info"><div class="name" title="${esc(f.name)}">${esc(f.name)}</div></div>`;
            el.onclick=()=>{cur=f.path;reload();};
            items.appendChild(el);
          });
          if(items.children.length===(cur?1:0)){
            items.insertAdjacentHTML('beforeend','<div class="empty">空のフォルダ</div>');
          }
        }catch(e){items.innerHTML='<div class="empty">読み込み失敗</div>';}
      }
      reload();
    }

    /* ===================== FAB ===================== */
    $('#fab').onclick=()=>{
      const menu = document.createElement('div');
      menu.className='ctx-menu';
      menu.innerHTML = `
        <div class="mi" data-act="upload">📤 ファイルをアップロード</div>
        <div class="mi" data-act="folder">📁 フォルダを作成</div>`;
      document.body.appendChild(menu);
      const fab = $('#fab').getBoundingClientRect();
      menu.style.bottom = (window.innerHeight - fab.top + 8) + 'px';
      menu.style.right = '24px';
      menu.style.top = 'auto'; menu.style.left = 'auto';
      $$('.mi', menu).forEach(mi=>{
        mi.onclick=()=>{menu.remove();
          if(mi.dataset.act==='upload') $('#fileInput').click();
          else if(mi.dataset.act==='folder') createFolder();
        };
      });
      setTimeout(()=>document.addEventListener('click',()=>menu.remove(),{once:true}),10);
    };

    async function createFolder(){
      const name = prompt('フォルダ名');
      if(!name) return;
      const r = await api('POST','/api/folder?path='+enc(S.path)+'&name='+enc(name));
      toast(r.ok?'作成しました':'失敗: '+r.status); loadFiles(S.path);
    }

    /* ===================== アップロード ===================== */
    $('#fileInput').onchange=async(e)=>{
      const files = Array.from(e.target.files);
      if(files.length===0) return;
      for(const f of files){ await uploadOne(f); }
      e.target.value=''; loadFiles(S.path);
    };

    function uploadOne(file){
      return new Promise((resolve)=>{
        const modal = openModal('アップロード中', `
          <div>${esc(file.name)}</div>
          <div class="progress"><div class="fill" id="upfill"></div></div>
          <div style="margin-top:8px;font-size:12px;color:var(--sub)" id="upinfo">0%</div>`);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', S.host + '/api/upload?path='+enc(S.path)+'&name='+enc(file.name));
        xhr.upload.onprogress=(ev)=>{
          if(!ev.lengthComputable) return;
          const pct = Math.round(ev.loaded/ev.total*100);
          modal.querySelector('#upfill').style.width = pct+'%';
          modal.querySelector('#upinfo').textContent = pct+'% ('+fmt(ev.loaded)+' / '+fmt(ev.total)+')';
        };
        xhr.onload=()=>{
          setTimeout(()=>modal.parentElement.remove(), 300);
          if(xhr.status===201) toast('アップロード完了: '+file.name);
          else toast('失敗: '+xhr.status);
          resolve();
        };
        xhr.onerror=()=>{modal.parentElement.remove();toast('通信エラー');resolve();};
        xhr.send(file);
      });
    }

    /* ===================== 検索 ===================== */
    let searchTimer;
    $('#searchInput').oninput=(e)=>{
      clearTimeout(searchTimer);
      searchTimer = setTimeout(()=>filterLocal(e.target.value), 200);
    };
    function filterLocal(q){
      if(!q){ render(); return; }
      if(S.searchMode) return;
      const filtered = S.files.filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));
      const sorted = sortFiles(filtered);
      const content = $('#content');
      if(sorted.length===0){
        content.innerHTML='';
        $('#empty').textContent='「'+q+'」に一致なし';
        $('#empty').style.display='block'; return;
      }
      $('#empty').style.display='none';
      content.innerHTML = sorted.map(itemHtml).join('');
      bindItems(sorted);
    }

    $('#btnServerSearch').onclick=async()=>{
      const q = $('#searchInput').value.trim();
      if(!q){ toast('検索語を入力'); return; }
      S.searchMode = true;
      try{
        const res = await api('GET','/api/search?path='+enc(S.path)+'&q='+enc(q));
        const list = await res.json();
        S.files = list;
        const sorted = sortFiles(list);
        if(sorted.length===0){
          $('#content').innerHTML='';
          $('#empty').textContent='「'+q+'」に一致なし';
          $('#empty').style.display='block';
        } else {
          $('#empty').style.display='none';
          $('#content').innerHTML = sorted.map(itemHtml).join('');
          bindItems(sorted);
        }
        $('#status').textContent = '🔍「'+q+'」: '+list.length+'件';
      }catch(e){ toast('検索失敗'); }
    };

    /* ===================== ゴミ箱 ===================== */
    $('#btnTrash').onclick=async()=>{
      try{
        const res = await api('GET','/api/trash');
        const list = await res.json();
        const modal = openModal('ゴミ箱 ('+list.length+')', list.length===0?'<div class="empty">ゴミ箱は空です</div>':'');
        const body = modal.querySelector('.body');
        if(list.length>0){
          body.innerHTML='';
          list.forEach(item=>{
            const el = document.createElement('div');
            el.className='item';
            el.innerHTML = `
              <div class="icon">${item.directory?'📁':'📄'}</div>
              <div class="info">
                <div class="name">${esc(item.original)}</div>
                <div class="meta">${new Date(item.trashedAt).toLocaleString()}</div>
              </div>
              <button class="btn-neutral" data-restore>戻す</button>
              <button class="btn-danger" data-del>削除</button>`;
            el.querySelector('[data-restore]').onclick=async(ev)=>{
              ev.stopPropagation();
              const r = await api('POST','/api/trash/restore?name='+enc(item.name)+'&to='+enc(S.path));
              toast(r.ok?'復元しました':'失敗: '+r.status);
              modal.parentElement.remove();
              if(r.ok) $('#btnTrash').click();
            };
            el.querySelector('[data-del]').onclick=async(ev)=>{
              ev.stopPropagation();
              if(!confirm('完全に削除しますか？')) return;
              const r = await api('DELETE','/api/trash?name='+enc(item.name));
              toast(r.ok?'削除しました':'失敗: '+r.status);
              modal.parentElement.remove();
              if(r.ok) $('#btnTrash').click();
            };
            body.appendChild(el);
          });
          const footer = modal.querySelector('footer');
          const emptyBtn = document.createElement('button');
          emptyBtn.className='btn-danger';
          emptyBtn.textContent='空にする';
          emptyBtn.onclick=async()=>{
            if(!confirm('ゴミ箱を完全に空にしますか？')) return;
            const r = await api('DELETE','/api/trash?name=ALL');
            toast(r.ok?'空にしました':'失敗');
            modal.parentElement.remove();
          };
          footer.insertBefore(emptyBtn, footer.firstChild);
        }
      }catch(e){ toast('取得失敗'); }
    };

    /* ===================== サーバー状態 ===================== */
    $('#btnStatus').onclick=async()=>{
      const modal = openModal('サーバー状態', '<div>取得中...</div>');
      const body = modal.querySelector('.body');
      try{
        const [st, sg] = await Promise.all([
          fetch(S.host+'/api/status').then(r=>r.ok?r.json():null).catch(()=>null),
          fetch(S.host+'/api/storage').then(r=>r.ok?r.json():null).catch(()=>null)
        ]);
        let html='';
        if(st){
          html += `<h3 style="margin:12px 0 4px;color:var(--primary);font-size:12px">デバイス</h3>`;
          html += row('モデル', st.model);
          html += row('Android', 'API '+st.android);
          html += `<h3 style="margin:12px 0 4px;color:var(--primary);font-size:12px">バッテリー</h3>`;
          html += row('残量', st.batteryPercent+'%');
          if(st.batteryTempC > 0) html += row('温度', st.batteryTempC.toFixed(1)+' °C');
          html += `<h3 style="margin:12px 0 4px;color:var(--primary);font-size:12px">メモリ</h3>`;
          html += row('使用中', fmt(st.totalMemory - st.freeMemory));
          html += row('空き', fmt(st.freeMemory));
          html += row('合計', fmt(st.totalMemory));
          html += `<h3 style="margin:12px 0 4px;color:var(--primary);font-size:12px">稼働時間</h3>`;
          html += row('Uptime', fmtUptime(st.uptimeSeconds));
        }
        if(sg){
          html += `<h3 style="margin:12px 0 4px;color:var(--primary);font-size:12px">ストレージ</h3>`;
          html += row('保存先', sg.name);
          if(sg.total > 0){
            html += row('使用中', fmt(sg.total - sg.free));
            html += row('空き', fmt(sg.free));
            html += row('合計', fmt(sg.total));
          }
        }
        if(st){
          html += `<h3 style="margin:12px 0 4px;color:var(--primary);font-size:12px">サーバー</h3>`;
          html += row('バインドIP', st.boundIp || '-');
          html += row('処理中', st.activeRequests);
          html += row('ログ件数', st.logSize);
        }
        body.innerHTML = html || '<div>取得できませんでした</div>';
      }catch(e){ body.innerHTML='<div>エラー: '+esc(e.message)+'</div>'; }
    };
    function row(l,v){return `<div class="row"><div class="lbl">${l}</div><div class="val">${esc(String(v))}</div></div>`;}
    function fmtUptime(s){
      const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
      if(d>0) return d+'日 '+h+'時間 '+m+'分';
      if(h>0) return h+'時間 '+m+'分';
      if(m>0) return m+'分';
      return s+'秒';
    }

    /* ===================== 一括削除 ===================== */
    $('#btnSelDelete').onclick=async()=>{
      if(S.sel.size===0) return;
      if(!confirm(S.sel.size+'件を削除しますか？')) return;
      let failed=0;
      for(const p of Array.from(S.sel)){
        const r = await api('DELETE','/api/files?path='+enc(p)+'&trash=true');
        if(!r.ok) failed++;
      }
      toast(failed===0?'削除しました':failed+'件失敗');
      exitSelMode(); loadFiles(S.path);
    };

    /* ===================== 初期化 ===================== */
    S.host = window.location.origin;
    applyTheme(); applyView();
    if(S.hidden) $('#btnHidden').classList.add('active');
    $('#btnSort').textContent='↕ '+sorts.find(s=>s[0]===S.sort)[1];
    refreshAuthStatus();
    applyRoute();
</script>
</body>
</html>
